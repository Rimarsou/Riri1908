name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static site to gh-pages
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          src_dir="${workdir}/src"
          dest_dir="${workdir}/dest"
          auth_header="AUTHORIZATION: bearer ${GH_TOKEN}"

          git -c "http.https://github.com/.extraheader=${auth_header}" \
            clone --depth 1 --branch "${REF_NAME}" \
            "https://github.com/${REPOSITORY}.git" "${src_dir}"

          if git -c "http.https://github.com/.extraheader=${auth_header}" \
            clone --depth 1 --branch gh-pages \
            "https://github.com/${REPOSITORY}.git" "${dest_dir}"; then
            echo "Checked out existing gh-pages branch"
          else
            git -c "http.https://github.com/.extraheader=${auth_header}" \
              clone --depth 1 "https://github.com/${REPOSITORY}.git" "${dest_dir}"
            cd "${dest_dir}"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            "${src_dir}/" "${dest_dir}/"

          cd "${dest_dir}"
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy ${SHA}"
          git push origin gh-pages
